<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>REJCC — Le parcours d'adhésion (vertical)</title>
<style>
  @font-face { font-family: 'Anton'; src: url('fonts/anton-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 500; src: url('fonts/manrope-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 700; src: url('fonts/manrope-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 800; src: url('fonts/manrope-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Caslon'; src: url('fonts/libre-caslon-display-latin-400-normal.woff2') format('woff2'); }
  :root { --navy:#031d59; --navy7:#0a2c6e; --azure:#4f6fbf; --red:#ac0100; --cloud:#f4f6f8; --ink:#333; --green:#1f9d55; --amber:#d98a00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--navy);
           font-family: 'Manrope', sans-serif; color: #fff; transform-origin: 0 0; }
  .layer { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .navy { background: var(--navy); color: #fff; }
  .cloud { background: var(--cloud); color: var(--navy); }
  .abs { position: absolute; }
  .mask { display: block; overflow: hidden; }
  .mask > span { display: block; will-change: transform; }
  .anton { font-family: 'Anton', sans-serif; text-transform: uppercase; line-height: .98; }
  .anton .mask { padding-top: .24em; margin-top: -.24em; }
  .caslon { font-family: 'Caslon', serif; line-height: 1.16; }
  .caslon .mask { padding-bottom: .08em; }
  .red { color: var(--red); }
  .kicker { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 20px; letter-spacing: .26em; text-transform: uppercase; }
  .kicker i { display: block; width: 56px; height: 2px; background: var(--red); transform-origin: left; }
  .body { font-weight: 500; font-size: 28px; line-height: 1.5; }
  .center { left: 0; right: 0; text-align: center; }
  svg.ico { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }

  /* Appareils */
  .laptop { position: absolute; }
  .laptop .lid { position: relative; padding: 16px 16px 26px; border-radius: 24px; background: #0d1426; border: 1.5px solid #2c3754;
                 box-shadow: 0 70px 120px -50px rgba(3,29,89,.55), 0 30px 60px -30px rgba(0,0,0,.35); }
  .laptop .lid::after { content: ''; position: absolute; left: 50%; bottom: 10px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: #26314d; }
  .laptop .base { position: relative; height: 24px; margin: 0 -8%; border-radius: 0 0 20px 20px; background: linear-gradient(#e6eaf1, #b5bdcb); box-shadow: 0 24px 40px -18px rgba(3,29,89,.45); }
  .laptop .base::before { content: ''; position: absolute; left: 50%; top: 0; width: 16%; height: 8px; margin-left: -8%; border-radius: 0 0 12px 12px; background: #9aa4b6; }
  .screen { position: relative; overflow: hidden; background: #fff; }
  .laptop .screen { border-radius: 5px; }
  .screen img { position: absolute; left: 0; top: 0; width: 100%; display: block; }
  .phone { position: absolute; padding: 11px; border-radius: 54px; background: #0a0e18; border: 2px solid #343c52;
           box-shadow: 0 60px 100px -40px rgba(0,0,0,.6), inset 0 0 0 2px #1a2030; }
  .phone .screen { border-radius: 43px; }
  .phone .island { position: absolute; top: 22px; left: 50%; width: 92px; height: 27px; margin-left: -46px; border-radius: 16px; background: #000; z-index: 3; }

  /* Éléments d'interface du film */
  .pill { display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px; border-radius: 999px; font-weight: 800; font-size: 24px; white-space: nowrap; }
  .pill.white { background: #fff; color: var(--navy); box-shadow: 0 20px 40px -24px rgba(3,29,89,.5); border: 1.5px solid rgba(3,29,89,.1); }
  .feat { display: flex; gap: 22px; align-items: center; }
  .feat .ic { width: 74px; height: 74px; border-radius: 22px; display: grid; place-items: center; flex: none; }
  .feat b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.01em; }
  .feat span { display: block; font-size: 22px; font-weight: 500; opacity: .75; margin-top: 2px; }
  .steplist .row { display: flex; align-items: center; gap: 18px; height: 54px; padding: 0 18px; border-radius: 14px; font-weight: 700; font-size: 24px; color: rgba(3,29,89,.45); }
  .steplist .row .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 800; border: 2px solid currentColor; flex: none; }
  .browser { position: absolute; border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 30px 60px -30px rgba(3,29,89,.5); border: 1.5px solid rgba(3,29,89,.1); }
  .browser .bar { height: 30px; background: #eef1f6; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .browser .bar i { width: 10px; height: 10px; border-radius: 50%; background: #c9d1de; display: block; }
  .browser .shot { position: relative; overflow: hidden; }
  .browser .shot img { width: 100%; display: block; }
  .browser .lbl { position: absolute; left: 0; right: 0; bottom: -48px; text-align: center; font-weight: 800; font-size: 22px; color: var(--navy); }

  #tracker { position: absolute; left: 0; right: 0; top: 96px; display: flex; justify-content: center; gap: 10px; z-index: 58; visibility: hidden; }
  #tracker .tk { display: flex; align-items: center; gap: 10px; padding: 9px 18px 9px 12px; border-radius: 999px; font-weight: 800; font-size: 17px; letter-spacing: .02em; }
  #tracker .tk .d { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }
  #cursor { position: absolute; left: 0; top: 0; width: 40px; height: 40px; z-index: 70; visibility: hidden; pointer-events: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  #ripple { position: absolute; z-index: 69; width: 20px; height: 20px; border-radius: 50%; border: 4px solid var(--red); visibility: hidden; pointer-events: none; }

  #hud { z-index: 60; pointer-events: none; visibility: visible; overflow: visible; }
  #hud .c { position: absolute; width: 34px; height: 34px; border: 0 solid currentColor; opacity: .45; }
  #hud .tl { top: 34px; left: 34px; border-top-width: 1.5px; border-left-width: 1.5px; }
  #hud .tr { top: 34px; right: 34px; border-top-width: 1.5px; border-right-width: 1.5px; }
  #hud .bl { bottom: 34px; left: 34px; border-bottom-width: 1.5px; border-left-width: 1.5px; }
  #hud .br { bottom: 34px; right: 34px; border-bottom-width: 1.5px; border-right-width: 1.5px; }
  #hud .m { position: absolute; font-size: 15px; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; opacity: .7; white-space: nowrap; }
  #hud .m1 { top: 44px; left: 90px; } #hud .m2 { top: 44px; right: 90px; }
  #hud .m3 { bottom: 44px; left: 90px; } #hud .m4 { bottom: 44px; right: 90px; }
  #hud .bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--red); transform-origin: left; }
</style>
</head>
<body>
<div id="stage"></div>
<script>window.VERTICAL = true;</script>
<script src="logo.js"></script>
<script src="data.js"></script>
<script src="cues.js"></script>
<script src="tour.js"></script>
</body>
</html>
